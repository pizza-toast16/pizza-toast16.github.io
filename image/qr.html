<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide html5-qrcode standard visual clutter */
        #reader video {
            object-fit: cover !important;
            border-radius: 0.75rem;
        }
        #reader {
            border: none !important;
        }
        #reader__scan_region {
            background: transparent;
        }
        #reader__dashboard {
            display: none !important;
        }
        /* Custom scanner overlay line animation */
        @keyframes scanAnimation {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 95%; opacity: 1; }
            100% { top: 0%; opacity: 0.8; }
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
            box-shadow: 0 0 15px #3b82f6;
            animation: scanAnimation 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-full flex flex-col justify-between items-center p-4 md:p-8">

    <!-- Header Section -->
    <header class="w-full max-w-md text-center my-4">
        <div class="inline-flex items-center gap-3 mb-2">
            <div class="p-3 bg-blue-600/20 text-blue-400 rounded-2xl border border-blue-500/30">
                <i class="fa-solid fa-qrcode text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">QR スキャナー</h1>
        </div>
        <p class="text-slate-400 text-sm">カメラまたは画像ファイルから速やかに解読します</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col gap-5">
        
        <!-- Mode Switcher Tabs -->
        <div class="bg-slate-800/80 p-1.5 rounded-xl flex border border-slate-700/60 shadow-inner">
            <button id="tab-camera" onclick="switchMode('camera')" class="flex-1 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200 bg-blue-600 text-white shadow-md">
                <i class="fa-solid fa-camera"></i> カメラでスキャン
            </button>
            <button id="tab-file" onclick="switchMode('file')" class="flex-1 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200 text-slate-400 hover:text-white">
                <i class="fa-solid fa-image"></i> 画像を選択
            </button>
        </div>

        <!-- Camera Scanner Card -->
        <div id="camera-section" class="bg-slate-800/50 backdrop-blur-md rounded-2xl p-4 border border-slate-700/50 shadow-xl flex flex-col items-center relative overflow-hidden">
            
            <!-- Camera Viewport Frame -->
            <div class="relative w-full aspect-square bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center border border-slate-700">
                <!-- Video Element Target -->
                <div id="reader" class="w-full h-full"></div>

                <!-- Custom Overlay UI when scanning -->
                <div id="scanner-overlay" class="absolute inset-0 pointer-events-none hidden">
                    <div class="scan-line"></div>
                    <!-- Frame corners -->
                    <div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-blue-400 rounded-tl-sm"></div>
                    <div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-blue-400 rounded-tr-sm"></div>
                    <div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-blue-400 rounded-bl-sm"></div>
                    <div class="absolute bottom-4 right-4 w-6 h-6 border-b-2 border-r-2 border-blue-400 rounded-br-sm"></div>
                </div>

                <!-- Camera Start Placeholder -->
                <div id="camera-placeholder" class="flex flex-col items-center justify-center p-6 text-center">
                    <i class="fa-solid fa-camera-rotate text-4xl text-slate-500 mb-3 animate-pulse"></i>
                    <p class="text-slate-300 text-sm font-medium mb-4">カメラアクセスが必要です</p>
                    <button onclick="startCamera()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm transition-colors shadow-lg shadow-blue-600/30 flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> カメラを起動
                    </button>
                </div>
            </div>

            <!-- Camera Controls (Visible when active) -->
            <div id="camera-controls" class="w-full flex items-center justify-between gap-2 mt-4 hidden">
                <button onclick="stopCamera()" class="py-2 px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-stop"></i> 停止
                </button>
                <div class="flex items-center gap-2">
                    <button id="torch-btn" onclick="toggleTorch()" class="py-2 px-3 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-xs font-medium transition-colors hidden" title="ライト切り替え">
                        <i class="fa-solid fa-lightbulb"></i>
                    </button>
                    <button id="switch-cam-btn" onclick="switchCamera()" class="py-2 px-3 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl text-xs font-medium transition-colors" title="カメラ切り替え">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- File Upload Card -->
        <div id="file-section" class="bg-slate-800/50 backdrop-blur-md rounded-2xl p-6 border border-slate-700/50 shadow-xl hidden flex-col items-center justify-center min-h-[300px]">
            <label for="qr-input-file" class="w-full h-48 border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl flex flex-col items-center justify-center cursor-pointer transition-colors bg-slate-900/40 hover:bg-slate-900/80 p-4 text-center">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
                <span class="text-sm font-medium text-slate-200 mb-1">クリックして画像を選択</span>
                <span class="text-xs text-slate-500">PNG, JPG, WEBP, GIF 等に対応</span>
                <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            </label>
            <div id="file-loading" class="hidden mt-4 text-sm text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-spinner animate-spin"></i> 解析中...
            </div>
        </div>

        <!-- Status / Toast Notification -->
        <div id="status-box" class="hidden py-3 px-4 rounded-xl text-xs font-medium border flex items-center gap-2">
            <i id="status-icon" class="fa-solid"></i>
            <span id="status-message"></span>
        </div>

        <!-- Scan Result Display Card -->
        <div id="result-card" class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl hidden flex-col gap-3">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-check"></i> 検出完了
                </span>
                <span id="result-time" class="text-[10px] text-slate-400"></span>
            </div>

            <!-- Scanned Content Area -->
            <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-700/50 max-h-40 overflow-y-auto break-all">
                <p id="result-text" class="text-sm text-slate-200 select-all font-mono"></p>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 pt-1">
                <button onclick="copyToClipboard()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-medium transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-copy"></i> コピー
                </button>
                <a id="open-url-btn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-medium transition-colors flex items-center justify-center gap-2 hidden">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 開く
                </a>
            </div>
        </div>

        <!-- History Container -->
        <div id="history-container" class="bg-slate-800/30 rounded-2xl p-4 border border-slate-800 hidden flex-col gap-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">最近の読み取り履歴</h3>
                <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">消去</button>
            </div>
            <ul id="history-list" class="space-y-2 max-h-36 overflow-y-auto pr-1"></ul>
        </div>

    </main>

    <footer class="mt-8 text-center text-slate-500 text-xs">
        <p>HTML5 QR Code Reader &bull; Web Camera & File API</p>
    </footer>

    <!-- App Logic Scripts -->
    <script>
        let html5QrCode = null;
        let isScanning = false;
        let currentFacingMode = "environment";
        let torchEnabled = false;
        let scanHistory = JSON.parse(localStorage.getItem('qr_scan_history') || '[]');

        window.onload = () => {
            renderHistory();
        };

        // Switch Tabs: Camera / File
        function switchMode(mode) {
            const camTab = document.getElementById('tab-camera');
            const fileTab = document.getElementById('tab-file');
            const camSec = document.getElementById('camera-section');
            const fileSec = document.getElementById('file-section');

            if (mode === 'camera') {
                camTab.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200 bg-blue-600 text-white shadow-md";
                fileTab.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200 text-slate-400 hover:text-white";
                camSec.classList.remove('hidden');
                camSec.classList.add('flex');
                fileSec.classList.add('hidden');
                fileSec.classList.remove('flex');
            } else {
                stopCamera();
                fileTab.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200 bg-blue-600 text-white shadow-md";
                camTab.className = "flex-1 py-2.5 px-4 rounded-lg font-medium text-sm flex items-center justify-center gap-2 transition-all duration-200 text-slate-400 hover:text-white";
                fileSec.classList.remove('hidden');
                fileSec.classList.add('flex');
                camSec.classList.add('hidden');
                camSec.classList.remove('flex');
            }
        }

        // Start Web Camera Scanner
        async function startCamera() {
            if (isScanning) return;
            showStatus('', 'hidden');

            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }

                document.getElementById('camera-placeholder').classList.add('hidden');
                document.getElementById('scanner-overlay').classList.remove('hidden');
                document.getElementById('camera-controls').classList.remove('hidden');
                document.getElementById('camera-controls').classList.add('flex');

                const config = { 
                    fps: 10, 
                    qrbox: { width: 220, height: 220 },
                    aspectRatio: 1.0
                };

                await html5QrCode.start(
                    { facingMode: currentFacingMode },
                    config,
                    onScanSuccess,
                    onScanFailure
                );

                isScanning = true;
                checkTorchSupport();

            } catch (err) {
                console.error("Camera access error:", err);
                stopCamera();
                showStatus("カメラの起動に失敗しました。アクセス許可を確認してください。", "error");
            }
        }

        // Stop Camera Scanner
        async function stopCamera() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (e) {
                    console.error("Stop scanner error", e);
                }
            }
            isScanning = false;
            torchEnabled = false;

            document.getElementById('camera-placeholder').classList.remove('hidden');
            document.getElementById('scanner-overlay').classList.add('hidden');
            document.getElementById('camera-controls').classList.add('hidden');
            document.getElementById('camera-controls').classList.remove('flex');
            document.getElementById('torch-btn').classList.add('hidden');
        }

        // Toggle Facing Camera (Front/Back)
        async function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            if (isScanning) {
                await stopCamera();
                startCamera();
            }
        }

        // Torch toggle feature check
        function checkTorchSupport() {
            try {
                const capabilities = html5QrCode.getRunningTrackCapabilities();
                if (capabilities.torch) {
                    document.getElementById('torch-btn').classList.remove('hidden');
                } else {
                    document.getElementById('torch-btn').classList.add('hidden');
                }
            } catch (e) {
                document.getElementById('torch-btn').classList.add('hidden');
            }
        }

        // Toggle Torch Light
        async function toggleTorch() {
            if (!html5QrCode || !isScanning) return;
            try {
                torchEnabled = !torchEnabled;
                await html5QrCode.applyVideoConstraints({
                    advanced: [{ torch: torchEnabled }]
                });
                const torchBtn = document.getElementById('torch-btn');
                if (torchEnabled) {
                    torchBtn.classList.add('bg-amber-500', 'text-slate-900');
                    torchBtn.classList.remove('bg-slate-700', 'text-slate-300');
                } else {
                    torchBtn.classList.remove('bg-amber-500', 'text-slate-900');
                    torchBtn.classList.add('bg-slate-700', 'text-slate-300');
                }
            } catch (e) {
                console.error("Torch activation failed", e);
            }
        }

        // Handle Image File Selection
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loadingIndicator = document.getElementById('file-loading');
            loadingIndicator.classList.remove('hidden');
            showStatus('', 'hidden');

            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                const result = await html5QrCode.scanFile(file, true);
                onScanSuccess(result);
            } catch (err) {
                console.error("File scan error:", err);
                showStatus("QRコードが見つかりませんでした。別の画像をお試しください。", "error");
            } finally {
                loadingIndicator.classList.add('hidden');
                event.target.value = ''; // Reset input
            }
        }

        // On Scan Success Callback
        function onScanSuccess(decodedText) {
            // Display Scan Result
            const resultCard = document.getElementById('result-card');
            const resultText = document.getElementById('result-text');
            const openUrlBtn = document.getElementById('open-url-btn');
            const resultTime = document.getElementById('result-time');

            resultText.textContent = decodedText;
            resultTime.textContent = new Date().toLocaleTimeString();

            // Check if result is a valid URL
            if (isValidUrl(decodedText)) {
                openUrlBtn.href = decodedText;
                openUrlBtn.classList.remove('hidden');
            } else {
                openUrlBtn.classList.add('hidden');
            }

            resultCard.classList.remove('hidden');
            resultCard.classList.add('flex');

            // Save to history
            addHistoryItem(decodedText);
            
            // Audio Feedback (Optional optional soft tone using Web Audio API)
            playBeepSound();
        }

        // On Scan Failure (Ignore constant frame miss logs)
        function onScanFailure(error) {
            // Silence frame scan misses
        }

        // Clipboard Copy Helper
        function copyToClipboard() {
            const text = document.getElementById('result-text').textContent;
            if (!text) return;

            // Fallback strategy for iframe environments
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showStatus("クリップボードにコピーしました！", "success");
            } catch (err) {
                showStatus("コピーに失敗しました。", "error");
            }
            document.body.removeChild(textArea);
        }

        // Status Toast Notification display
        function showStatus(msg, type) {
            const box = document.getElementById('status-box');
            const icon = document.getElementById('status-icon');
            const message = document.getElementById('status-message');

            if (type === 'hidden') {
                box.classList.add('hidden');
                return;
            }

            box.classList.remove('hidden');
            message.textContent = msg;

            if (type === 'error') {
                box.className = "py-3 px-4 rounded-xl text-xs font-medium border flex items-center gap-2 bg-rose-500/10 text-rose-300 border-rose-500/30";
                icon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else if (type === 'success') {
                box.className = "py-3 px-4 rounded-xl text-xs font-medium border flex items-center gap-2 bg-emerald-500/10 text-emerald-300 border-emerald-500/30";
                icon.className = "fa-solid fa-check text-emerald-400";
            }
        }

        // Helper to check valid URL format
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        // Play subtle sound on success
        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // History Functionality
        function addHistoryItem(text) {
            if (scanHistory.length > 0 && scanHistory[0].text === text) return; // Prevent immediate duplicates
            
            scanHistory.unshift({
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            if (scanHistory.length > 10) scanHistory.pop(); // Keep last 10
            localStorage.setItem('qr_scan_history', JSON.stringify(scanHistory));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const list = document.getElementById('history-list');

            if (scanHistory.length === 0) {
                container.classList.add('hidden');
                container.classList.remove('flex');
                return;
            }

            container.classList.remove('hidden');
            container.classList.add('flex');
            list.innerHTML = '';

            scanHistory.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between text-xs bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/40 hover:border-slate-600 transition-colors cursor-pointer group";
                
                const isUrl = isValidUrl(item.text);

                li.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden mr-2" onclick="selectHistoryItem(${index})">
                        <i class="fa-solid ${isUrl ? 'fa-link text-blue-400' : 'fa-font text-slate-400'} text-xs shrink-0"></i>
                        <span class="truncate text-slate-300 font-mono text-[11px]">${escapeHtml(item.text)}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 shrink-0">${item.time}</span>
                `;
                list.appendChild(li);
            });
        }

        function selectHistoryItem(index) {
            const item = scanHistory[index];
            if (item) {
                onScanSuccess(item.text);
            }
        }

        function clearHistory() {
            scanHistory = [];
            localStorage.removeItem('qr_scan_history');
            renderHistory();
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
