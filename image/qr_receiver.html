<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>QRデータ受信機</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --panel2: #0b1220;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #10b981;
      --blue: #6366f1;
      --red: #f43f5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .wrap { width: min(1100px, 100%); margin: 0 auto; padding: 24px 16px 40px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .logo {
      width: 46px; height: 46px; display: grid; place-items: center;
      background: #059669; border-radius: 13px; font-size: 25px;
      box-shadow: 0 8px 24px #05966933;
    }
    h1 { font-size: clamp(20px, 4vw, 27px); margin: 0; }
    header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
    .panel {
      min-width: 0; background: #1e293bdc; border: 1px solid #334155b8;
      border-radius: 18px; padding: 20px; box-shadow: 0 15px 40px #02061735;
    }
    .panel h2 { margin: 0 0 16px; font-size: 16px; }
    .camera-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .btn {
      border: 0; border-radius: 10px; padding: 10px 15px; font-weight: 700;
      cursor: pointer; transition: filter .15s, transform .15s; color: white;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .green { background: #059669; }
    .red { background: #e11d48; }
    .blue { background: #4f46e5; }
    .gray { background: #475569; }
    .camera-box {
      position: relative; aspect-ratio: 4 / 3; width: 100%; overflow: hidden;
      display: grid; place-items: center; background: #020617;
      border: 1px solid var(--border); border-radius: 13px; margin-top: 14px;
    }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .placeholder { padding: 25px; color: #64748b; text-align: center; font-size: 13px; line-height: 1.7; }
    .placeholder .cam-icon { font-size: 42px; display: block; margin-bottom: 8px; }
    .scan-frame { position: absolute; inset: 0; border: 4px solid transparent; pointer-events: none; transition: border-color .12s; }
    .scan-frame.active { border-color: var(--green); }
    .upload-label {
      display: flex; justify-content: center; align-items: center; gap: 9px;
      width: 100%; margin-top: 14px; padding: 13px 12px; cursor: pointer;
      border: 1px dashed #64748b; border-radius: 11px; color: #cbd5e1;
      background: #0f172a; font-size: 13px; text-align: center;
    }
    .upload-label:hover { border-color: #34d399; background: #111e2e; }
    input[type=file] { display: none; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 12px 1px 0; }
    .error {
      display: none; padding: 11px 12px; border-radius: 10px; margin-top: 12px;
      background: #88133755; border: 1px solid #fb718566; color: #fecdd3;
      font-size: 12px; line-height: 1.6;
    }
    .error.show { display: block; }
    .stats { margin-top: 18px; }
    .stats-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .stats-line strong { color: #6ee7b7; font-variant-numeric: tabular-nums; }
    .bar { height: 11px; background: #0b1220; border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
    .bar > div { width: 0; height: 100%; background: linear-gradient(90deg, #059669, #34d399); transition: width .2s; }
    .bottom-status { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; margin-top: 8px; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .result-head h2 { margin: 0; }
    textarea {
      display: block; resize: vertical; width: 100%; min-height: 300px; padding: 13px;
      border: 1px solid var(--border); border-radius: 12px; outline: none;
      background: #0b1220; color: #a7f3d0; font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    textarea:focus { border-color: #10b981; box-shadow: 0 0 0 2px #10b98122; }
    .actions { display: flex; gap: 10px; margin-top: 12px; }
    .actions .btn { flex: 1; }
    .success {
      display: none; margin-top: 14px; padding: 12px; border-radius: 10px;
      color: #a7f3d0; background: #065f4638; border: 1px solid #34d39955;
      font-size: 12px; line-height: 1.5;
    }
    .success.show { display: block; }
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 15px);
      opacity: 0; pointer-events: none; transition: .2s; z-index: 10;
      max-width: calc(100vw - 28px); padding: 11px 16px; border-radius: 11px;
      background: #334155; border: 1px solid #64748b; color: white; font-size: 12px;
      box-shadow: 0 8px 30px #0006;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 760px) {
      .wrap { padding: 18px 12px 30px; }
      .grid { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
      textarea { min-height: 230px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo" aria-hidden="true">▦</div>
      <div>
        <h1>QRデータ受信機</h1>
        <p>アニメーションQRコードからデータを読み取って復元します</p>
      </div>
    </header>

    <div class="grid">
      <section class="panel" aria-labelledby="scanner-title">
        <div class="camera-head">
          <h2 id="scanner-title">📷 QRコード読み取り</h2>
          <button id="camera-button" class="btn green" type="button">カメラ起動</button>
        </div>

        <div id="camera-error" class="error" role="alert"></div>

        <div class="camera-box">
          <video id="camera-video" autoplay playsinline muted hidden></video>
          <div id="camera-placeholder" class="placeholder">
            <span class="cam-icon">▣</span>
            「カメラ起動」を押すか、下からQRコード画像を選択してください。
          </div>
          <div id="scan-frame" class="scan-frame"></div>
        </div>

        <label class="upload-label" for="image-files">
          <span aria-hidden="true">📁</span>
          <span>QRコード画像を選択（複数可）</span>
        </label>
        <input id="image-files" type="file" accept="image/*" multiple>
        <p class="hint">カメラはHTTPSまたはlocalhostで開いた場合に利用できます。画像ファイルからも読み取れます。アニメーションQRは、送信側の再生を続けてください。</p>

        <div class="stats">
          <div class="stats-line">
            <span>データ受信進行度</span>
            <strong id="percent">0%</strong>
          </div>
          <div class="bar"><div id="progress-bar"></div></div>
          <div class="bottom-status">
            <span id="packet-status">受信済: 0 / 未定</span>
            <span id="missing-status">未読み取りコマあり</span>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="result-title">
        <div class="result-head">
          <h2 id="result-title">📝 復元されたテキスト</h2>
          <button id="clear-button" class="btn gray" type="button">クリア</button>
        </div>
        <textarea id="result" readonly spellcheck="false" placeholder="すべてのコマを受信すると、復元されたデータがここに表示されます。"></textarea>
        <div class="actions">
          <button id="copy-button" class="btn blue" type="button" disabled>テキストをコピー</button>
          <button id="save-button" class="btn gray" type="button" disabled>テキストを保存</button>
        </div>
        <div id="success-message" class="success" role="status">✓ すべてのコマを受信しました。データの復元が完了しました。</div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    const video = document.getElementById('camera-video');
    const scanCanvas = document.createElement('canvas');
    const scanContext = scanCanvas.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let scanning = false;
    let animationFrameId = null;
    let lastScanAt = 0;
    let toastTimer = null;
    let flashTimer = null;

    // 送信側（修正版）の ODT2 形式と、旧版の番号/総数|データ形式に対応。
    let receivedChunks = new Map();
    let expectedTotal = null;
    let currentTransferId = null;

    const SCAN_INTERVAL_MS = 80; // 約12.5回/秒
    const MAX_CAMERA_SIDE = 1600;
    const MAX_IMAGE_SIDE = 2200;

    const $ = (id) => document.getElementById(id);

    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function showError(message) {
      const box = $('camera-error');
      box.textContent = message;
      box.classList.add('show');
    }

    function hideError() {
      $('camera-error').classList.remove('show');
    }

    function flashScanFrame() {
      const frame = $('scan-frame');
      frame.classList.add('active');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => frame.classList.remove('active'), 150);
    }

    function updateReceiverUI() {
      if (!expectedTotal) return;

      const count = receivedChunks.size;
      const percent = Math.floor((count / expectedTotal) * 100);
      $('percent').textContent = `${percent}%`;
      $('progress-bar').style.width = `${percent}%`;
      $('packet-status').textContent = `受信済: ${count} / ${expectedTotal}`;

      const missing = [];
      for (let i = 1; i <= expectedTotal; i++) {
        if (!receivedChunks.has(i)) missing.push(i);
      }

      if (missing.length) {
        const preview = missing.slice(0, 5).join(', ');
        $('missing-status').textContent = `未取得: ${preview}${missing.length > 5 ? ' …' : ''}`;
        $('success-message').classList.remove('show');
      } else {
        $('missing-status').textContent = '全コマ受信完了';
        reconstructText();
        $('success-message').classList.add('show');
      }
    }

    function reconstructText() {
      let text = '';
      for (let i = 1; i <= expectedTotal; i++) {
        text += receivedChunks.get(i) ?? '';
      }
      $('result').value = text;
      $('copy-button').disabled = text.length === 0;
      $('save-button').disabled = text.length === 0;
    }

    function resetReceiver(showNotice = false) {
      receivedChunks.clear();
      expectedTotal = null;
      currentTransferId = null;
      $('percent').textContent = '0%';
      $('progress-bar').style.width = '0%';
      $('packet-status').textContent = '受信済: 0 / 未定';
      $('missing-status').textContent = '未読み取りコマあり';
      $('result').value = '';
      $('copy-button').disabled = true;
      $('save-button').disabled = true;
      $('success-message').classList.remove('show');
      if (showNotice) showToast('受信データをクリアしました');
    }

    function processScannedData(data) {
      if (typeof data !== 'string') return false;

      let transferId;
      let index;
      let total;
      let payload;
      let match = data.match(/^ODT2\|([a-zA-Z0-9-]+)\|(\d+)\|(\d+)\|([\s\S]*)$/);

      if (match) {
        transferId = match[1];
        index = Number.parseInt(match[2], 10);
        total = Number.parseInt(match[3], 10);
        payload = match[4];
      } else {
        // 元のHTMLが生成する旧形式。
        match = data.match(/^(\d+)\/(\d+)\|([\s\S]*)$/);
        if (!match) return false;
        transferId = 'legacy';
        index = Number.parseInt(match[1], 10);
        total = Number.parseInt(match[2], 10);
        payload = match[3];
      }

      if (!Number.isSafeInteger(index) || !Number.isSafeInteger(total) ||
          total < 1 || total > 100000 || index < 1 || index > total) {
        return false;
      }

      // 転送IDが違うデータが来たら、新しい転送として受信を開始。
      // 旧形式には転送IDがないため、旧形式同士の切替時は手動で「クリア」してください。
      if (currentTransferId !== transferId) {
        receivedChunks.clear();
        currentTransferId = transferId;
        expectedTotal = total;
        $('result').value = '';
        $('success-message').classList.remove('show');
        $('copy-button').disabled = true;
        $('save-button').disabled = true;
      } else if (expectedTotal !== total) {
        return false;
      }

      if (receivedChunks.has(index)) return false;
      receivedChunks.set(index, payload);
      updateReceiverUI();
      return true;
    }

    async function startCamera() {
      hideError();
      if (typeof window.jsQR !== 'function') {
        showError('QR読み取りライブラリを読み込めませんでした。インターネット接続を確認して再読み込みしてください。');
        return;
      }
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        showError('このページではカメラを利用できません。HTTPSまたはlocalhostで開いてください。画像アップロードは利用できます。');
        return;
      }

      try {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
        } catch (firstError) {
          if (['NotFoundError', 'OverconstrainedError'].includes(firstError.name)) {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          } else {
            throw firstError;
          }
        }

        video.srcObject = stream;
        video.hidden = false;
        $('camera-placeholder').hidden = true;
        await video.play();
        scanning = true;
        lastScanAt = 0;
        $('camera-button').textContent = 'カメラ停止';
        $('camera-button').classList.remove('green');
        $('camera-button').classList.add('red');
        animationFrameId = requestAnimationFrame(scanCameraFrame);
      } catch (error) {
        console.error('Camera error:', error);
        let message = 'カメラを起動できませんでした。ブラウザのカメラ設定を確認してください。';
        if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
          message = 'カメラの使用が許可されていません。ブラウザの設定でカメラを許可してください。';
        } else if (error.name === 'NotFoundError') {
          message = '利用できるカメラが見つかりませんでした。';
        } else if (error.name === 'NotReadableError') {
          message = 'カメラを他のアプリが使用している可能性があります。他のアプリを閉じてください。';
        }
        showError(message);
        stopCamera();
      }
    }

    function stopCamera() {
      scanning = false;
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.pause();
      video.srcObject = null;
      video.hidden = true;
      $('camera-placeholder').hidden = false;
      $('camera-button').textContent = 'カメラ起動';
      $('camera-button').classList.remove('red');
      $('camera-button').classList.add('green');
    }

    function scanCameraFrame(timestamp) {
      if (!scanning) return;

      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && video.videoWidth > 0 &&
          timestamp - lastScanAt >= SCAN_INTERVAL_MS) {
        lastScanAt = timestamp;
        try {
          const scale = Math.min(1, MAX_CAMERA_SIDE / Math.max(video.videoWidth, video.videoHeight));
          const width = Math.max(1, Math.round(video.videoWidth * scale));
          const height = Math.max(1, Math.round(video.videoHeight * scale));
          if (scanCanvas.width !== width || scanCanvas.height !== height) {
            scanCanvas.width = width;
            scanCanvas.height = height;
          }
          scanContext.drawImage(video, 0, 0, width, height);
          const imageData = scanContext.getImageData(0, 0, width, height);
          const code = jsQR(imageData.data, width, height, { inversionAttempts: 'attemptBoth' });
          if (code && code.data && processScannedData(code.data)) flashScanFrame();
        } catch (error) {
          console.error('QR scan error:', error);
        }
      }

      if (scanning) animationFrameId = requestAnimationFrame(scanCameraFrame);
    }

    function decodeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ファイルを読み込めませんでした'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('画像を開けませんでした'));
          image.onload = () => {
            try {
              const scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(image.naturalWidth, image.naturalHeight));
              const width = Math.max(1, Math.round(image.naturalWidth * scale));
              const height = Math.max(1, Math.round(image.naturalHeight * scale));
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const context = canvas.getContext('2d', { willReadFrequently: true });
              if (!context) throw new Error('画像解析用Canvasを作成できません');
              context.drawImage(image, 0, 0, width, height);
              const imageData = context.getImageData(0, 0, width, height);
              const code = jsQR(imageData.data, width, height, { inversionAttempts: 'attemptBoth' });
              resolve(code ? code.data : null);
            } catch (error) {
              reject(error);
            }
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleImageFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      hideError();
      if (typeof window.jsQR !== 'function') {
        showError('QR読み取りライブラリを読み込めませんでした。インターネット接続を確認してください。');
        return;
      }

      let successCount = 0;
      let notFoundCount = 0;
      let failedCount = 0;
      // 順番に処理して、複数画像を安定して読み込む。
      for (const file of files) {
        if (!file.type.startsWith('image/')) {
          failedCount++;
          continue;
        }
        try {
          const data = await decodeImage(file);
          if (data && processScannedData(data)) successCount++;
          else if (data) notFoundCount++;
          else notFoundCount++;
        } catch (error) {
          console.error(`Image decode error (${file.name}):`, error);
          failedCount++;
        }
      }

      if (successCount > 0) {
        showToast(`${successCount}枚のQRコードを受信しました`);
      } else if (notFoundCount > 0 && failedCount === 0) {
        showToast('QRコードを読み取れませんでした。画像を鮮明にして再試行してください。');
      } else {
        showToast(`読み取り成功 ${successCount}枚／失敗 ${failedCount}枚`);
      }
      $('image-files').value = '';
    }

    async function copyResult() {
      const text = $('result').value;
      if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const field = $('result');
          field.focus();
          field.select();
          const copied = document.execCommand('copy');
          if (!copied) throw new Error('コピーに失敗しました');
        }
        showToast('テキストをコピーしました');
      } catch (error) {
        console.error('Copy error:', error);
        showToast('コピーできませんでした。テキストを選択してコピーしてください。');
      }
    }

    function saveResult() {
      const text = $('result').value;
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'received-data.txt';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast('テキストファイルを保存しました');
    }

    $('camera-button').addEventListener('click', () => scanning ? stopCamera() : startCamera());
    $('image-files').addEventListener('change', event => handleImageFiles(event.target.files));
    $('clear-button').addEventListener('click', () => resetReceiver(true));
    $('copy-button').addEventListener('click', copyResult);
    $('save-button').addEventListener('click', saveResult);
    window.addEventListener('pagehide', stopCamera);

    if (typeof window.jsQR !== 'function') {
      showError('QR読み取りライブラリを読み込めませんでした。インターネットに接続して再読み込みしてください。');
    }
  </script>
</body>
</html>
